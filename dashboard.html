<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Volunteer Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        'primary-dark': '#1d4ed8',
                        secondary: '#0ea5e9',
                        tertiary: '#0369a1',
                        background: '#f0f9ff',
                        'border-light': '#e0f2fe',
                        'hover-text': '#0284c7'
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .message {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            z-index: 1000;
            background: white;
            border: 1px solid #d0e4f1;
            box-shadow: 0 8px 16px rgba(208, 228, 241, 0.3);
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .message.error {
            color: #991b1b;
            border: 2px solid #f87171;
            background: #fef2f2;
        }
        .message.success {
            color: #166534;
            border: 2px solid #4ade80;
            background: #f0fdf4;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-background to-white font-sans antialiased">
    <div id="message" class="message hidden"></div>
    
    <nav class="bg-white shadow-lg fixed w-full z-20 top-0 border-b border-border-light">
        <div class="container px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-6">
                    <div class="flex items-center">
                        <i class="fas fa-hands-helping text-primary text-2xl mr-2"></i>
                        <h1 class="text-xl font-bold text-tertiary">Admin Dashboard</h1>
                    </div>
                    <div class="hidden md:flex space-x-2">
                        <a href="dashboard.html" class="nav-link text-tertiary px-3 py-2 text-sm font-medium flex items-center border-b-2 border-primary">
                            <i class="fas fa-home mr-2"></i>Dashboard
                        </a>
                        <a href="events.html" class="nav-link text-tertiary px-3 py-2 text-sm font-medium flex items-center">
                            <i class="fas fa-calendar mr-2"></i>Events
                        </a>
                        <a href="users.html" class="nav-link text-tertiary px-3 py-2 text-sm font-medium flex items-center">
                            <i class="fas fa-users mr-2"></i>Users
                        </a>
                        <a href="reports.html" class="nav-link text-tertiary px-3 py-2 text-sm font-medium flex items-center">
                            <i class="fas fa-chart-bar mr-2"></i>Reports
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <button id="profileBtn" class="nav-link text-tertiary px-3 py-2 text-sm font-medium flex items-center">
                        <i class="fas fa-user mr-2"></i>Profile
                    </button>
                    <button id="logoutBtn" class="bg-primary text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-primary-dark transition-colors">
                        <i class="fas fa-sign-out-alt mr-2"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container pt-24 pb-12">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Stats Cards -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 bg-blue-100 rounded-lg mr-4">
                        <i class="fas fa-users text-primary text-xl"></i>
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">Total Users</p>
                        <p class="text-2xl font-bold text-tertiary" id="totalUsers">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 bg-green-100 rounded-lg mr-4">
                        <i class="fas fa-calendar-check text-primary text-xl"></i>
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">Total Events</p>
                        <p class="text-2xl font-bold text-tertiary" id="totalEvents">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 bg-yellow-100 rounded-lg mr-4">
                        <i class="fas fa-clock text-primary text-xl"></i>
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">Pending Approvals</p>
                        <p class="text-2xl font-bold text-tertiary" id="pendingApprovals">0</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex items-center">
                    <div class="p-3 bg-purple-100 rounded-lg mr-4">
                        <i class="fas fa-chart-line text-primary text-xl"></i>
                    </div>
                    <div>
                        <p class="text-gray-600 text-sm">Total Hours</p>
                        <p class="text-2xl font-bold text-tertiary" id="totalHours">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="mt-8 bg-white rounded-xl shadow-md p-6">
            <h2 class="text-xl font-bold mb-6 text-tertiary">Recent Activity</h2>
            <div id="recentActivity" class="space-y-4">
                <!-- Activity items will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        async function checkSession() {
            try {
                const response = await fetch('../includes/check_session.php');
                const data = await response.json();
                if (!data.logged_in || data.role !== 'admin') {
                    window.location.href = '../index.html';
                }
            } catch (error) {
                console.error('Session check failed:', error);
                window.location.href = '../index.html';
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('../includes/get_admin_stats.php');
                const data = await response.json();
                if (data.success) {
                    document.getElementById('totalUsers').textContent = data.stats.total_users;
                    document.getElementById('totalEvents').textContent = data.stats.total_events;
                    document.getElementById('pendingApprovals').textContent = data.stats.pending_approvals;
                    document.getElementById('totalHours').textContent = data.stats.total_hours;
                }
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function loadRecentActivity() {
            try {
                const response = await fetch('../includes/get_recent_activity.php');
                const data = await response.json();
                if (data.success) {
                    const activityContainer = document.getElementById('recentActivity');
                    activityContainer.innerHTML = data.activities.map(activity => `
                        <div class="flex items-center p-4 bg-gray-50 rounded-lg">
                            <div class="p-3 bg-white rounded-lg mr-4">
                                <i class="fas ${getActivityIcon(activity.type)} text-primary"></i>
                            </div>
                            <div>
                                <p class="text-gray-600">${activity.description}</p>
                                <p class="text-sm text-gray-500">${new Date(activity.timestamp).toLocaleString()}</p>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Failed to load recent activity:', error);
            }
        }

        function getActivityIcon(type) {
            const icons = {
                'registration': 'fa-user-plus',
                'event': 'fa-calendar-check',
                'approval': 'fa-check-circle',
                'cancellation': 'fa-times-circle'
            };
            return icons[type] || 'fa-info-circle';
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.classList.remove('hidden');
            
            setTimeout(() => {
                messageDiv.classList.add('hidden');
            }, 3000);
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('../includes/logout.php');
                const data = await response.json();
                if (data.success) {
                    window.location.href = '../index.html';
                } else {
                    throw new Error(data.message || 'Logout failed');
                }
            } catch (error) {
                console.error('Logout failed:', error);
                showMessage('Failed to logout. Please try again.', 'error');
            }
        });

        document.getElementById('profileBtn').addEventListener('click', () => {
            window.location.href = 'profile.html';
        });

        // Initialize dashboard
        checkSession();
        loadStats();
        loadRecentActivity();
    </script>
</body>
</html>
